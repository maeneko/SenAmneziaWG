<!doctype html>
<html lang="ru" data-platform="other">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Установка AmnesiaWG</title>
    <!--
      The setup screen is plain HTML on purpose: it must be on screen the moment the window opens,
      and it is the one part of the app that cannot afford to wait for a framework to boot.
      Open this file in a browser to watch the animation without building anything.
    -->
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/app.css" />
    <link rel="stylesheet" href="./installer.css" />
  </head>
  <body>
    <div class="app app-narrow">
      <div class="setup-stage" id="stage">
        <section class="setup" id="setup" data-phase="work">
          <div class="setup-main">
            <div class="mark">
              <svg class="ring" viewBox="0 0 128 128" aria-hidden="true">
                <circle class="ring-track" cx="64" cy="64" r="59" />
                <circle class="ring-arc" id="arc" cx="64" cy="64" r="59" />
              </svg>
              <span class="ring-pulse" aria-hidden="true"></span>
              <img
                class="mark-logo"
                id="logo"
                src="../src/assets/logo.png"
                alt=""
                aria-hidden="true"
                draggable="false"
              />
            </div>

            <h1 class="setup-title">AmnesiaWG</h1>
            <p class="setup-sub" id="sub" role="status" aria-live="polite"><span>Установка</span></p>

            <ol class="steps" id="steps">
              <li class="step" data-state="pending">
                <span class="step-mark" aria-hidden="true">
                  <span class="mark-dot"></span>
                  <span class="mark-spin"></span>
                  <span class="mark-done">
                    <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                  </span>
                </span>
                <span class="step-label">Файлы программы</span>
              </li>
              <li class="step" data-state="pending">
                <span class="step-mark" aria-hidden="true">
                  <span class="mark-dot"></span>
                  <span class="mark-spin"></span>
                  <span class="mark-done">
                    <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                  </span>
                </span>
                <span class="step-label">Служба подключения</span>
              </li>
              <li class="step" data-state="pending">
                <span class="step-mark" aria-hidden="true">
                  <span class="mark-dot"></span>
                  <span class="mark-spin"></span>
                  <span class="mark-done">
                    <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                  </span>
                </span>
                <span class="step-label">Запуск службы</span>
              </li>
            </ol>
          </div>

          <p class="setup-foot" id="foot">beta-0.1.0-win</p>
        </section>

        <!-- The first-run greeting, straight out of the app: the setup screen turns into it in place. -->
        <section class="welcome" id="welcome">
          <div class="titlebar-drag" aria-hidden="true"></div>
          <div class="welcome-body">
            <div class="welcome-main">
              <img
                class="logo welcome-logo"
                id="welcome-logo"
                src="../src/assets/logo.png"
                alt=""
                aria-hidden="true"
                draggable="false"
              />
              <h1 class="welcome-title">Приветствую вас!</h1>
              <label class="welcome-sub" for="first-key">Вставьте ваш первый ключ:</label>
              <div class="key-slot">
                <textarea class="key-input" id="first-key" placeholder="vpn://…" spellcheck="false"></textarea>
              </div>
            </div>
            <div class="welcome-actions"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="./installer.js"></script>
  </body>
</html>
