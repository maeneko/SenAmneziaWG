<!doctype html>
<html lang="ru" data-platform="other">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Установка SenAWG</title>
    <!--
      The setup screen is plain HTML on purpose: it must be on screen the moment the window opens,
      and it is the one part of the app that cannot afford to wait for a framework to boot.
      Open this file in a browser to watch the animation without building anything.
    -->
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/app.css" />
    <link rel="stylesheet" href="./installer.css" />
  </head>
  <body>
    <div class="app app-narrow">
      <div class="setup-stage" id="stage">
        <section class="setup" id="setup" data-phase="intro">
          <div class="setup-main">
            <!-- The one thing every screen here shares, and the only one that outlives them all. -->
            <div class="mark">
              <svg class="ring" viewBox="0 0 128 128" aria-hidden="true">
                <circle class="ring-track" cx="64" cy="64" r="59" />
                <circle class="ring-arc" id="arc" cx="64" cy="64" r="59" />
              </svg>
              <span class="ring-pulse" aria-hidden="true"></span>
              <img
                class="mark-logo"
                id="logo"
                src="../src/assets/logo.png"
                alt=""
                aria-hidden="true"
                draggable="false"
              />
            </div>

            <!-- Fixed height: the panels swap inside it, and the mark above never moves. -->
            <div class="setup-panel">
              <div class="panel panel-on" id="panel-intro">
                <h1 class="setup-title" id="intro-title">Добро пожаловать!</h1>
                <p class="setup-sub" id="intro-sub">Установим SenAWG на этот компьютер.</p>
                <div class="setup-actions">
                  <button class="btn btn-filled sl" id="express"><span>Быстрая установка</span></button>
                  <button class="btn btn-tonal sl" id="manual"><span>Выбрать папку</span></button>
                </div>
              </div>

              <div class="panel" id="panel-path">
                <h1 class="setup-title">Куда установить?</h1>
                <div class="path-row">
                  <input class="path-input mono" id="path" spellcheck="false" aria-label="Папка установки" />
                  <button class="btn btn-tonal sl path-browse" id="browse"><span>Обзор…</span></button>
                </div>
                <!--
                  Where things really go. The service runs as SYSTEM, so its files are kept where only an
                  administrator can change them, whatever folder is picked for the application itself.
                -->
                <p class="path-note">
                  <span class="path-note-app" id="path-note"></span>
                  <span>Служба — всегда в C:\Program Files\SenAWG.</span>
                </p>
                <div class="setup-actions">
                  <button class="btn btn-tonal sl" id="back"><span>Назад</span></button>
                  <button class="btn btn-filled sl" id="install"><span>Установить</span></button>
                </div>
              </div>

              <div class="panel" id="panel-work">
                <h1 class="setup-title">SenAWG</h1>
                <p class="setup-sub" id="sub" role="status" aria-live="polite"><span>Установка</span></p>

                <ol class="steps" id="steps">
                  <li class="step" data-state="pending">
                    <span class="step-mark" aria-hidden="true">
                      <span class="mark-dot"></span>
                      <span class="mark-spin"></span>
                      <span class="mark-done">
                        <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                      </span>
                      <span class="mark-fail">
                        <svg viewBox="0 0 20 20"><path d="M6.8 6.8 13.2 13.2M13.2 6.8 6.8 13.2" /></svg>
                      </span>
                    </span>
                    <span class="step-label">Файлы программы</span>
                  </li>
                  <li class="step" data-state="pending">
                    <span class="step-mark" aria-hidden="true">
                      <span class="mark-dot"></span>
                      <span class="mark-spin"></span>
                      <span class="mark-done">
                        <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                      </span>
                      <span class="mark-fail">
                        <svg viewBox="0 0 20 20"><path d="M6.8 6.8 13.2 13.2M13.2 6.8 6.8 13.2" /></svg>
                      </span>
                    </span>
                    <span class="step-label">Служба подключения</span>
                  </li>
                  <li class="step" data-state="pending">
                    <span class="step-mark" aria-hidden="true">
                      <span class="mark-dot"></span>
                      <span class="mark-spin"></span>
                      <span class="mark-done">
                        <svg viewBox="0 0 20 20"><path d="M5.4 10.4 8.5 13.5 14.6 7" /></svg>
                      </span>
                      <span class="mark-fail">
                        <svg viewBox="0 0 20 20"><path d="M6.8 6.8 13.2 13.2M13.2 6.8 6.8 13.2" /></svg>
                      </span>
                    </span>
                    <span class="step-label">Запуск службы</span>
                  </li>
                </ol>
              </div>
            </div>
          </div>

          <!-- Sits above the footer instead of in the column: appearing must not move the mark. -->
          <p class="notice setup-error" id="error" role="alert"></p>

          <!-- Filled from window.awgSetup.buildId; the space keeps the line's height until then. -->
          <p class="setup-foot" id="foot">&nbsp;</p>
        </section>

        <!-- The first-run greeting, straight out of the app: the setup screen turns into it in place. -->
        <section class="welcome" id="welcome">
          <div class="titlebar-drag" aria-hidden="true"></div>
          <div class="welcome-body">
            <div class="welcome-main">
              <img
                class="logo welcome-logo"
                id="welcome-logo"
                src="../src/assets/logo.png"
                alt=""
                aria-hidden="true"
                draggable="false"
              />
              <h1 class="welcome-title" id="welcome-title">Приветствую вас!</h1>
              <label class="welcome-sub" for="first-key">Вставьте ваш первый ключ:</label>
              <div class="key-slot">
                <textarea
                  class="key-input key-swap mono"
                  id="first-key"
                  placeholder="vpn://…"
                  rows="4"
                  autocomplete="off"
                  spellcheck="false"
                  aria-describedby="first-key-status"
                ></textarea>
                <!-- Empty, but it takes its gap: without it the column is 12px shorter than the real one. -->
                <div id="first-key-status" aria-live="polite"></div>
              </div>
            </div>
            <div class="welcome-actions"></div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="./installer.js"></script>
  </body>
</html>
