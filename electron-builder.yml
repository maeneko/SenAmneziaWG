appId: com.senawg.desktop
productName: SenAWG
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.utilities
  target:
    - dmg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The privileged helper must ship as a plain file next to the app, not inside the asar.
  extraResources:
    - from: resources/scripts
      to: scripts
      filter:
        - '**/*'
    # Pinned amneziawg-go (scripts/build-amneziawg.sh); the app never falls back to a system copy when packaged.
    - from: resources/bin
      to: bin
      filter:
        - amneziawg-go
    # Licenses: ours, the bundled components', and Electron/Chromium's (on Windows electron-builder adds those itself).
    - from: .
      to: licenses
      filter:
        - LICENSE
        - THIRD_PARTY_NOTICES.md
    - from: node_modules/electron/dist
      to: licenses
      filter:
        - LICENSES.chromium.html
    - from: node_modules/electron/dist/LICENSE
      to: licenses/LICENSE.electron.txt
  # Sign the bundled daemon with the app identity (and notarize it with the app).
  binaries:
    - Contents/Resources/bin/amneziawg-go
  # Local builds are unsigned. Set `identity` and `notarize` before distributing.
  identity: null
dmg:
  title: SenAWG
win:
  # The downloaded file is a self-extracting stub, not an installer: it unpacks into %TEMP%, starts the app
  # with PORTABLE_EXECUTABLE_FILE set, and that app IS the installer — it draws the setup screen and does
  # the work through `awg-helper setup` (src/main/setup, helper/setup_windows.go). Nothing runs elevated until
  # the user presses «Установить»; NSIS's own wizard and uninstaller are not used.
  target:
    - target: portable
      arch:
        - x64
  # The window is NOT elevated: everything privileged is done by the SenAWG service (helper/), which
  # `awg-helper setup` registers once. That is the whole point of this build, so never ask for administrator here.
  requestedExecutionLevel: asInvoker
  # Square, edge to edge: the rounded macOS tile (build/icon.png) looks out of place on Windows.
  icon: build/icon-win.png
  # awg-helper.exe is what `setup` installs as the SYSTEM service, and wintun.dll must sit next to it.
  # Built by scripts/build-helper-win.mjs (npm run build:helper).
  extraResources:
    - from: resources/win
      to: win
      filter:
        - awg-helper.exe
        - wintun.dll
    # The tray and the window take their icon from here at run time.
    - from: build
      to: win
      filter:
        - icon-win.png
    - from: .
      to: licenses
      filter:
        - LICENSE
        - THIRD_PARTY_NOTICES.md
portable:
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  # `dir` only: scripts/make-run.sh wraps electron-builder's own unpacked output into the self-extracting
  # .run stub, the way electron-builder's `portable` target wraps the Windows one — see docs/installer.md
  # and docs/linux.md. Nothing here needs root; `awg-helper setup` (elevated, via pkexec) does the work,
  # the same shape as Windows.
  target:
    - target: dir
      arch:
        - x64
        - arm64
  category: Network
  executableName: senawg
  icon: build/icon.png
  extraResources:
    # ${arch} is one of electron-builder's own file macros; scripts/build-helper-linux.mjs lays the two
    # architectures out this way for exactly this reason (npm run build:helper:linux).
    - from: resources/linux/${arch}
      to: linux
      filter:
        - awg-helper
        - amneziawg-go
    - from: build
      to: linux
      filter:
        - icon.png
    - from: .
      to: licenses
      filter:
        - LICENSE
        - THIRD_PARTY_NOTICES.md
